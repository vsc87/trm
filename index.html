  background: #000;

  border-radius: 10px;
  box-shadow:

.play-button {

  left: 50%;
  width: clamp(48px, 13vw, 64px);
  height: clamp(48px, 13vw, 64px);
  transform: translate(-50%, -50%);

  border-radius: 50%;

  height: 0;
  border-top:

    solid transparent;
  border-bottom:
    clamp(8px, 2.5vw, 12px)
    solid transparent;
  border-left:
    clamp(13px, 4vw, 20px)
    solid #fff;
  margin-left: 4px;
